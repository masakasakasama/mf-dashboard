name: Scrape and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'AGENTS.md'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome
        if: github.event_name != 'push'
        uses: browser-actions/setup-chrome@latest

      - name: Install Scraper Dependencies
        if: github.event_name != 'push'
        run: npm install
        working-directory: scraper

      - name: Run Scraper
        if: github.event_name != 'push'
        working-directory: scraper
        env:
          MF_EMAIL: ${{ secrets.MF_EMAIL }}
          MF_PASSWORD: ${{ secrets.MF_PASSWORD }}
        run: npm run scrape
        continue-on-error: true

      # The Pages site is public: scraped data is published only as ciphertext,
      # and never at all when the passphrase secret is missing.
      - name: Encrypt scraped data
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: |
          if [ -f dashboard/public/data.json ] && [ -n "$DASHBOARD_PASSPHRASE" ]; then
            node dashboard/scripts/finance-data.mjs encrypt-file dashboard/public/data.json dashboard/public/data.enc.json
          fi
          rm -f dashboard/public/data.json dashboard/public/cashflow.json dashboard/public/subscriptions.json

      - name: Validate finance data is encrypted
        run: node dashboard/scripts/finance-data.mjs verify

      - name: Install Dashboard Dependencies
        run: npm install
        working-directory: dashboard

      - name: Test Dashboard
        run: npm test
        working-directory: dashboard

      - name: Build Dashboard
        run: npm run build
        working-directory: dashboard

      - name: Refuse to publish plaintext finance data
        run: |
          if ls dashboard/dist | grep -E '^(cashflow|subscriptions|data)\.json$'; then
            echo "plaintext finance JSON found in dist" && exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
